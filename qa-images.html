<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QA — image contact sheet</title>
<meta name="robots" content="noindex,nofollow">
<style>
  body { margin:0; background:#111; color:#ddd; font:13px/1.4 system-ui, sans-serif; padding:16px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  figure { margin:0; }
  img { width:100%; height:230px; object-fit:cover; display:block; background:#000; }
  figcaption { padding:6px 0; font-family:monospace; }
  .ok figcaption { color:#7FE3BE; }
  .bad figcaption { color:#ff7a6b; }
</style>
</head>
<body>
<h2>Clean candidates — no club, league or sponsor branding</h2>
<div class="grid">
  <figure class="ok"><img src="assets/img/lagos-night.webp" alt=""><figcaption>lagos-night ✓</figcaption></figure>
  <figure class="ok"><img src="assets/img/bridge-night.webp" alt=""><figcaption>bridge-night ?</figcaption></figure>
  <figure class="ok"><img src="assets/img/street-traffic.webp" alt=""><figcaption>street-traffic ?</figcaption></figure>
  <figure class="ok"><img src="assets/img/lagos-danfo.webp" alt=""><figcaption>lagos-danfo ?</figcaption></figure>
  <figure class="ok"><img src="assets/img/city-aerial.webp" alt=""><figcaption>city-aerial ?</figcaption></figure>
  <figure class="ok"><img src="assets/img/lagos-bridge.webp" alt=""><figcaption>lagos-bridge ✓</figcaption></figure>
  <figure class="ok"><img src="assets/img/floodlight-tower.webp" alt=""><figcaption>floodlight-tower ✓</figcaption></figure>
</div>
<h2 style="color:#ff7a6b">Rejected — third-party branding</h2>
<div class="grid">
  <figure class="bad"><img src="assets/img/floodlights-night.webp" alt=""><figcaption>NFL / Mercedes ✗</figcaption></figure>
  <figure class="bad"><img src="assets/img/pitch-lit.webp" alt=""><figcaption>PSG ✗</figcaption></figure>
  <figure class="bad"><img src="assets/img/pitch-goal.webp" alt=""><figcaption>PSG / Mastercard ✗</figcaption></figure>
  <figure class="bad"><img src="assets/img/crowd-banner.webp" alt=""><figcaption>club banners ✗</figcaption></figure>
  <figure class="bad"><img src="assets/img/crowd-packed.webp" alt=""><figcaption>Bilbao / LaLiga ✗</figcaption></figure>
</div>
</body>
</html>
