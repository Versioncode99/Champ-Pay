<!doctype html>
<!--
  Dev-only harness. Renders the 1200×630 social share card, which is then
  screenshotted to public/assets/img/og-default.png. Not deployed, not linked.
  Regenerate: serve locally, screenshot #card at 1200×630.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card — ChampPay</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
<style>
  body { margin: 0; background: #222; }
  #card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #05100c; color: #e9f5ef; display: flex; flex-direction: column;
    justify-content: space-between; padding: 68px 76px; box-sizing: border-box;
    isolation: isolate;
  }
  #card::before {
    content: ""; position: absolute; inset: 0; z-index: 0; opacity: .6;
    background-image: linear-gradient(#22453a 1px, transparent 1px), linear-gradient(90deg, #22453a 1px, transparent 1px);
    background-size: 84px 84px;
    -webkit-mask-image: radial-gradient(105% 95% at 88% 6%, #000 0%, transparent 70%);
            mask-image: radial-gradient(105% 95% at 88% 6%, #000 0%, transparent 70%);
  }
  #card > * { position: relative; z-index: 1; }
  .row { display: flex; align-items: center; gap: 16px; }
  .row svg { width: 40px; height: 40px; color: #7fe3be; }
  .wordmark { font-family: "Archivo"; font-variation-settings: "wdth" 112, "wght" 700; font-size: 34px; letter-spacing: -.03em; }
  h1 {
    margin: 0; font-family: "Archivo"; font-variation-settings: "wdth" 112, "wght" 700;
    font-size: 82px; line-height: .98; letter-spacing: -.05em; max-width: 17ch;
  }
  .lead { margin-top: 26px; font-family: "Archivo"; font-size: 25px; line-height: 1.42; color: #9fb8ae; max-width: 40ch; }
  .cardfoot { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid #22453a; padding-top: 26px; }
  .mono { font-family: "Martian Mono"; font-size: 14px; letter-spacing: .15em; text-transform: uppercase; color: #9fb8ae; }
  .slogan { font-family: "Martian Mono"; font-size: 14px; letter-spacing: .15em; text-transform: uppercase; color: #7fe3be; }
</style>
</head>
<body>
<div id="card">
  <div class="row">
    <svg viewBox="0 0 100 100" fill="currentColor" aria-hidden="true">
      <circle cx="43" cy="18" r="8.6"/><circle cx="66" cy="18" r="8.6"/><circle cx="89" cy="18" r="8.6"/>
      <circle cx="20" cy="39" r="8.6"/><circle cx="20" cy="61" r="8.6"/>
      <circle cx="43" cy="82" r="8.6"/><circle cx="66" cy="82" r="8.6"/><circle cx="89" cy="82" r="8.6"/>
    </svg>
    <span class="wordmark">CHAMPPAY</span>
  </div>

  <div>
    <h1>A new layer in the payment stack.</h1>
    <p class="lead">Merchant acceptance, multi-currency treasury and institutional liquidity — built for African businesses, from inside the market.</p>
  </div>

  <div class="cardfoot">
    <span class="mono">champ-pay.com</span>
    <span class="slogan">Pay Like a Champ</span>
  </div>
</div>
</body>
</html>
